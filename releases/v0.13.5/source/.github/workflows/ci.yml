# CI —— 每次推送 / PR 自动构建 + 测试，挡住「本机能跑换台机器就废」的问题。
#
# 触发：push 到 main / feature/**；PR 到 main；手动。
# 成本：ubuntu 1× / windows 2× / macOS 10× 计费分钟。
#   共享测试（Core + Integration，约 136 条）跑在 ubuntu，是主门禁；
#   两个平台 head 只验「能不能构建 + 平台专属集成测试」，不打包。
name: CI

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["docs/**", "**/*.md", "releases/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 共享代码（平台无关，最便宜的 ubuntu）──
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # 只碰平台无关的测试项目——不 restore 整个 slnx（里面有 net10.0-windows 项目）
      - name: Test · Core
        run: dotnet test tests/RemoteFlow.Core.Tests -c Release
              --logger "trx;LogFileName=core.trx" --results-directory artifacts/test
      - name: Test · Integration
        run: dotnet test tests/RemoteFlow.IntegrationTests -c Release
              --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-shared
          path: artifacts/test/*.trx
          if-no-files-found: ignore

  # ── Windows head ──
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build · RemoteFlow.App
        run: dotnet build src/RemoteFlow.App/RemoteFlow.App.csproj -c Release
      - name: Test · Integration.Windows
        run: dotnet test tests/RemoteFlow.IntegrationTests.Windows -c Release
              --logger "trx;LogFileName=win.trx" --results-directory artifacts/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: artifacts/test/*.trx
          if-no-files-found: ignore

  # ── macOS head：自建 FreeRDP（缓存）→ 编 shim → 构建 App → Mac 专属集成测试 ──
  macos:
    runs-on: macos-15   # Apple Silicon；FreeRDP / App 均按 arm64 构建
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install macos --skip-manifest-update
      - run: brew install cmake openssl@3

      - name: Cache FreeRDP dist (arm64)
        id: frdp-cache
        uses: actions/cache@v4
        with:
          path: native/rdp/freerdp-dist/arm64
          key: freerdp-arm64-${{ hashFiles('native/rdp/build-freerdp.sh') }}
      - name: Build FreeRDP (arm64)
        if: steps.frdp-cache.outputs.cache-hit != 'true'
        run: native/rdp/build-freerdp.sh arm64
      - name: Build RDP shim (arm64)
        run: native/rdp/build.sh arm64

      - name: Build · RemoteFlow.App.Mac (Debug, osx-arm64)
        run: dotnet build src/RemoteFlow.App.Mac/RemoteFlow.App.Mac.csproj -c Debug -r osx-arm64

      - name: Test · Integration.Mac
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          dotnet test tests/RemoteFlow.IntegrationTests.Mac -c Release \
            --logger "trx;LogFileName=mac.trx" --results-directory artifacts/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: artifacts/test/*.trx
          if-no-files-found: ignore
