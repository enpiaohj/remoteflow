<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RemoteFlow Terminal</title>
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
    }
    /* 让终端本体填满容器，避免出现双滚动条 */
    .xterm .xterm-viewport {
      overflow-y: auto;
      scrollbar-width: thin;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    'use strict';

    // ────────────────────────────────────────────────────────────
    // RemoteFlow 终端前端
    //
    // 分层原则：本页面只做「终端渲染 + 输入采集」，不参与任何 SSH 协议逻辑。
    // 与宿主之间始终以 Base64 编码的原始字节交换数据，这样多字节 UTF-8 字符
    // 即使被 TCP 分包切断，也由 xterm.js 的解码器负责拼接，不会出现半个汉字乱码。
    // ────────────────────────────────────────────────────────────

    const THEMES = {
      dark: {
        background: '#1E1E1E', foreground: '#CCCCCC', cursor: '#FFFFFF',
        selectionBackground: '#264F78',
        black: '#000000', red: '#CD3131', green: '#0DBC79', yellow: '#E5E510',
        blue: '#2472C8', magenta: '#BC3FBC', cyan: '#11A8CD', white: '#E5E5E5',
        brightBlack: '#666666', brightRed: '#F14C4C', brightGreen: '#23D18B',
        brightYellow: '#F5F543', brightBlue: '#3B8EEA', brightMagenta: '#D670D6',
        brightCyan: '#29B8DB', brightWhite: '#FFFFFF'
      },
      light: {
        background: '#FFFFFF', foreground: '#333333', cursor: '#333333',
        selectionBackground: '#ADD6FF',
        black: '#000000', red: '#CD3131', green: '#00BC00', yellow: '#949800',
        blue: '#0451A5', magenta: '#BC05BC', cyan: '#0598BC', white: '#555555',
        brightBlack: '#666666', brightRed: '#CD3131', brightGreen: '#14CE14',
        brightYellow: '#B5BA00', brightBlue: '#0451A5', brightMagenta: '#BC05BC',
        brightCyan: '#0598BC', brightWhite: '#A5A5A5'
      }
    };

    const terminal = new Terminal({
      fontFamily: '"Cascadia Mono", Consolas, "微软雅黑", monospace',
      fontSize: 14,
      cursorBlink: true,
      // 终端自身保留滚动缓冲区，满足「回看历史输出」的基本运维需求
      scrollback: 5000,
      // 让 xterm 按东亚宽字符规则排版，保证中文对齐正确
      allowProposedApi: true,
      theme: THEMES.dark
    });

    const fitAddon = new FitAddon.FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(document.getElementById('terminal'));

    const encoder = new TextEncoder();

    function toBase64(bytes) {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function fromBase64(text) {
      const binary = atob(text);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function post(message) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify(message));
      }
    }

    // 用户键入 → 转 UTF-8 字节 → 交给宿主发往远端
    terminal.onData(data => {
      post({ type: 'input', data: toBase64(encoder.encode(data)) });
    });

    // 处理 Ctrl+C 等由 xterm 直接产生的二进制序列之外的粘贴等场景
    terminal.onBinary(data => {
      const bytes = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) {
        bytes[i] = data.charCodeAt(i) & 0xFF;
      }
      post({ type: 'input', data: toBase64(bytes) });
    });

    let lastCols = 0;
    let lastRows = 0;

    function reportResize() {
      // 仅在行列数真正变化时通知，避免像素级抖动造成频繁的窗口变更请求
      if (terminal.cols !== lastCols || terminal.rows !== lastRows) {
        lastCols = terminal.cols;
        lastRows = terminal.rows;
        post({
          type: 'resize',
          cols: terminal.cols,
          rows: terminal.rows,
          width: Math.round(window.innerWidth),
          height: Math.round(window.innerHeight)
        });
      }
    }

    function fit() {
      try {
        fitAddon.fit();
        reportResize();
      } catch (e) {
        // 容器尺寸为 0（Tab 尚未显示）时 fit 会失败，属于正常情况
      }
    }

    // 用 ResizeObserver 跟随容器尺寸，比监听 window.resize 更贴合 Tab 切换场景
    new ResizeObserver(() => fit()).observe(document.getElementById('terminal'));

    // ── 暴露给宿主（C#）调用的 API ────────────────────────────────
    window.rfTerminal = {
      /** 写入来自远端的原始字节（Base64）。 */
      write(base64) {
        terminal.write(fromBase64(base64));
      },

      /** 直接写入一行提示文本，用于显示本地状态信息。 */
      writeLine(text) {
        terminal.writeln(text);
      },

      setTheme(name) {
        terminal.options.theme = THEMES[name] || THEMES.dark;
        document.body.style.background = terminal.options.theme.background;
      },

      setFont(family, size) {
        if (family) { terminal.options.fontFamily = family; }
        if (size) { terminal.options.fontSize = size; }
        fit();
      },

      fit,

      focus() {
        terminal.focus();
      },

      clear() {
        terminal.clear();
      },

      /** 返回当前选中的文本，供宿主执行复制。 */
      getSelection() {
        return terminal.getSelection();
      },

      /** 把剪贴板文本作为输入送往远端。 */
      paste(text) {
        terminal.paste(text);
      },

      getSize() {
        return JSON.stringify({ cols: terminal.cols, rows: terminal.rows });
      }
    };

    fit();
    terminal.focus();

    // 通知宿主：终端已就绪，可以开始建立 SSH 连接
    post({ type: 'ready', cols: terminal.cols, rows: terminal.rows });
  </script>
</body>
</html>
